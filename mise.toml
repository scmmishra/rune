[tools]
watchexec = "2.3.3"
# Must match Ghostty's minimum_zig_version at the pinned tag (Scripts/build-ghostty.sh).
zig = "0.17.0"

[tasks.build]
description = "Build Rune in Debug mode"
run = """
bash Scripts/build-ghostty.sh
xcodebuild \
  -project Rune.xcodeproj \
  -scheme Rune \
  -configuration Debug \
  -derivedDataPath DerivedData \
  build \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.dev]
description = "Build Rune Dev and open it beside the installed Rune"
run = "bash Scripts/dev.sh"

[tasks.watch]
description = "Rebuild and reopen Rune Dev when sources change"
run = """
watchexec \
  --watch Rune \
  --watch Rune.xcodeproj \
  --exts swift,plist,pbxproj,xcscheme,resolved \
  --debounce 500ms \
  --on-busy-update restart \
  -- mise run dev
"""

[tasks.site]
description = "Run the website at http://localhost:3939"
dir = "site"
run = "pnpm install && pnpm astro dev --port 3939"
