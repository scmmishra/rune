[tools]
watchexec = "2.3.3"

[tasks.build]
description = "Build Rune in Debug mode"
run = """
xcodebuild \
  -project Rune.xcodeproj \
  -scheme Rune \
  -configuration Debug \
  -derivedDataPath DerivedData \
  build \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.dev]
description = "Rebuild and relaunch Rune when sources change"
run = """
watchexec \
  --watch Rune \
  --watch Rune.xcodeproj \
  --exts swift,plist,pbxproj,xcscheme,resolved \
  --debounce 500ms \
  --on-busy-update restart \
  -- mise run relaunch
"""

[tasks.relaunch]
description = "Build and relaunch a single Rune development instance"
run = """
mise run build

app_executable="$PWD/DerivedData/Build/Products/Debug/Rune.app/Contents/MacOS/Rune"
pid_file="$PWD/DerivedData/rune-dev.pid"

killall Rune 2>/dev/null || true

attempt=0
while pgrep -x Rune >/dev/null && [ "$attempt" -lt 20 ]; do
  sleep 0.05
  attempt=$((attempt + 1))
done

nohup "$app_executable" "$PWD" >"$PWD/DerivedData/rune-dev.log" 2>&1 &
echo "$!" >"$pid_file"
"""
