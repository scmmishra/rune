[tools]
watchexec = "2.3.3"

[tasks.build]
description = "Build Rune in Debug mode"
run = """
xcodebuild \
  -project Rune.xcodeproj \
  -scheme Rune \
  -configuration Debug \
  -derivedDataPath DerivedData \
  build \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.dev]
description = "Build Rune Dev and open it beside the installed Rune"
run = "bash Scripts/dev.sh"

[tasks.watch]
description = "Rebuild and reopen Rune Dev when sources change"
run = """
watchexec \
  --watch Rune \
  --watch Rune.xcodeproj \
  --exts swift,plist,pbxproj,xcscheme,resolved \
  --debounce 500ms \
  --on-busy-update restart \
  -- mise run dev
"""
