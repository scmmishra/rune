[tools]
watchexec = "2.3.3"

[tasks.build]
description = "Build Rune in Debug mode"
run = """
xcodebuild \
  -project Rune.xcodeproj \
  -scheme Rune \
  -configuration Debug \
  -derivedDataPath DerivedData \
  build \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.dev]
description = "Rebuild and relaunch Rune when sources change"
run = """
watchexec \
  --watch Rune \
  --watch Rune.xcodeproj \
  --exts swift,plist,pbxproj,xcscheme,resolved \
  --debounce 500ms \
  --on-busy-update restart \
  -- mise run relaunch
"""

[tasks.relaunch]
description = "Build, install, and relaunch a single Rune development instance"
run = """
mise run build

built_app="$PWD/DerivedData/Build/Products/Debug/Rune.app"
installed_app="/Applications/Rune.app"

killall Rune 2>/dev/null || true

attempt=0
while pgrep -x Rune >/dev/null && [ "$attempt" -lt 20 ]; do
  sleep 0.05
  attempt=$((attempt + 1))
done

# Keep the app opened from Finder, Dock, Spotlight, and the CLI identical to
# the latest development build, including resources outside the executable.
rsync -a --delete "$built_app/" "$installed_app/"

# Keep automation's monochrome-output preference out of interactive shells.
env -u NO_COLOR open -a "$installed_app" "$PWD"
"""
