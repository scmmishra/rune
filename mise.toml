[tools]
watchexec = "2.3.3"

[tasks.build]
description = "Build Rune in Debug mode"
run = """
xcodebuild \
  -project Rune.xcodeproj \
  -scheme Rune \
  -configuration Debug \
  -derivedDataPath DerivedData \
  build \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.dev]
description = "Rebuild and relaunch Rune when sources change"
run = """
watchexec \
  --watch Rune \
  --watch Rune.xcodeproj \
  --exts swift,plist,pbxproj,xcscheme,resolved \
  --debounce 500ms \
  --on-busy-update restart \
  -- mise run relaunch
"""

[tasks.relaunch]
description = "Build, install, and relaunch a single Rune development instance"
run = "bash Scripts/relaunch.sh"
