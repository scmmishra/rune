name: Warm Package Cache

# Release runs are scoped to their tag and can only restore caches saved on
# main, so the Swift package cache is saved here rather than by releases.
on:
  push:
    branches: [main]
    paths:
      - Rune.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
  # GitHub evicts caches unused for 7 days; keep this one alive between releases.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve Swift packages
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Restore package cache
        id: cache
        uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Rune.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve packages
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          xcodebuild -project Rune.xcodeproj -scheme Rune \
            -derivedDataPath DerivedData -resolvePackageDependencies
