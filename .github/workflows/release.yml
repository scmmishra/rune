name: Build Release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Package macOS 26 / Apple Silicon
    # Rune's checks must also execute on its minimum supported macOS.
    runs-on: macos-26
    # A warm run takes about 8 minutes. A cold GhosttyKit build adds the Metal
    # Toolchain download and a Zig build on a 3-core runner, which nobody has timed.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Select Xcode 26
        id: xcode
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          echo "build=$(xcodebuild -version | sed -n 's/^Build version //p')" >> "$GITHUB_OUTPUT"
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk_version%%.*}" = 26

      - name: Validate release configuration
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a vX.Y.Z or X.Y.Z release tag."
            exit 1
          fi
          if [[ -z "$SPARKLE_PRIVATE_KEY" || -z "$SPARKLE_PUBLIC_KEY" ]]; then
            echo "::error::Configure the SPARKLE_PRIVATE_KEY secret and SPARKLE_PUBLIC_KEY variable. See RELEASING.md."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Saved by package-cache.yml on main; tag runs cannot share their own saves.
      - name: Restore package cache
        uses: actions/cache/restore@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Rune.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Saved by package-cache.yml on main. The key matches the one used there.
      - name: Restore GhosttyKit
        id: ghostty
        uses: actions/cache/restore@v4
        with:
          path: Vendor
          key: ghostty-${{ runner.os }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Scripts/build-ghostty.sh', 'Scripts/ghostty-patches/*', 'mise.toml') }}

      # Scripts/build-ghostty.sh needs these only when the cache missed.
      - name: Install Zig
        if: steps.ghostty.outputs.cache-hit != 'true'
        uses: jdx/mise-action@v5
        with:
          install_args: zig
          cache: false

      - name: Install Metal Toolchain
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun -sdk macosx metal --version

      # Does nothing when the cache restored Vendor/. Otherwise it builds Ghostty from source.
      - name: Build GhosttyKit
        run: bash Scripts/build-ghostty.sh

      - name: Build Debug and test highlighting
        run: |
          xcodebuild -project Rune.xcodeproj -scheme Rune -configuration Debug \
            -derivedDataPath DerivedData build CODE_SIGNING_ALLOWED=NO
          bash Scripts/check-highlighting.sh

      - name: Package release
        env:
          RUNE_VERSION: ${{ steps.release.outputs.version }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: bash Scripts/package-app.sh

      - name: Generate signed update feed
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          updates_directory="$(mktemp -d "$RUNNER_TEMP/rune-updates.XXXXXX")"
          cp build/Rune-arm64.zip "$updates_directory/"
          jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" > "$updates_directory/Rune-arm64.md"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
              --embed-release-notes \
              --link "https://github.com/$GITHUB_REPOSITORY" \
              --versions "$RELEASE_VERSION" \
              "$updates_directory"
          cp "$updates_directory/appcast.xml" build/appcast.xml
          test -s build/appcast.xml
          grep -q 'sparkle:edSignature=' build/appcast.xml
          grep -q '<sparkle:minimumSystemVersion>26.0</sparkle:minimumSystemVersion>' build/appcast.xml

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            build/Rune-arm64.zip build/Rune-arm64.zip.sha256 build/appcast.xml \
            --repo "$GITHUB_REPOSITORY" --clobber
